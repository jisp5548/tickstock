# Refreshes the committed market-data snapshot once a day. The commit triggers a Vercel redeploy, so the live
# site serves fresh data without ever calling the rate-limited APIs at runtime for watchlist stocks.
name: Refresh data snapshot

on:
  schedule:
    - cron: "30 22 * * 1-5" # 22:30 UTC on weekdays, after the US market close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh stale entries (quota-aware; failures keep the previous data)
        run: npm run snapshot
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "Refresh data snapshot"
          git push
